message: "Hi UDIC KOOK,\r\n\r\nActual versions of almost all the feelies really exist, and the files to produce them 100% exist and are complete. For the box though, the issue is that the art used is owned by someone else - we made a deal to transfer ownership, but I lost contact with the art's owner (my email address was lost to over-zealous 2-factor security 'improvements') so I am not really comfortable releasing those files (even for free) without permission to use or purchase of the art in question. I modified the art to match Ultima a little more, but the original is not mine."
