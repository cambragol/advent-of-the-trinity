message: "Loving Threat of the Trinity to bits - I've always wanted to replay Ultima IV but the combat got really dreary.  \r\nI am looking at xu4 cheats like CTRL+D to kill enemies and \"r\" to fill all reagents to 99\r\nI don't think I want to do both of those but I'd love one or the other to reduce the grind for Gold.  \r\nAre there any cheats that work?  I was messing with CheatEngine to give unlimited Gold but don't actually want to mess up my save if I get the hex offsets wrong.  \r\n\r\nThank you for the brilliant work I never knew I wanted to get chased by a fire breathing lizards into Paws :)  Hilarious!"
