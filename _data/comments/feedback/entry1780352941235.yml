message: "Hi Sam,\r\n\r\nGreat to hear you are loving Threat of the Trinity. \r\n\r\nxu4 cheats will not work at all here. I would also think that messing with the save game file could be 'dangerous' - there are many new things crammed into the original format, and any tweak could break a number of interconnected components.\r\n\r\nThe early game requires a new approach, new strategies, and that IS the game at that point. You have to strategize your way through it, and eventually you will reach a point where you are no longer struggling to survive the lands, and have established yourself as the potential avatar. Viewing this time as a 'grind' misses the forest for the trees so to speak. \r\n\r\nThe advice found in the 'History of Britannia' is very relevant. Additionally, Lord British's specific advice is very pertinent. I'll chime in and say that venturing out into the wilds, should only be done with a party of companions, and that you must sometimes flee battles and not always fight to death. It is better to live to day in order to fight tomorrow. Also, watch out for advice from the people of Britannia, as they have wisdom that can be used to even the odds in the early game."
